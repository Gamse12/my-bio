<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamse_Over | Bio</title>
    <style>
        /* === 1. CSS Стили Fakecrime/Kurumi Hybrid === */
        :root {
            --bg-dark: #08060f; 
            --text-color: #e5e5e5;
            --accent-color: #ff0055; /* Ярко-красный (Основной) */
            --secondary-accent: #8a2be2; /* Сине-фиолетовый (Второй акцент) */
            --card-bg: rgba(15, 10, 25, 0.9); 
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            font-family: var(--font-main);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-dark);
            text-align: center;
        }

        #background-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%; 
            min-height: 100%;
            width: auto; 
            height: auto;
            z-index: -100;
            filter: brightness(0.3) contrast(1.1); 
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 5px; 
            box-shadow: 
                0 0 30px rgba(255, 0, 85, 0.5),
                inset 0 0 10px rgba(138, 43, 226, 0.2); 
            padding: 40px;
            max-width: 650px;
            width: 90%;
            border: 1px solid var(--accent-color); 
            animation: fadeIn 1.5s ease-in-out;
            z-index: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            background: linear-gradient(90deg, var(--secondary-accent), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent; 
            font-size: 3.5em;
            margin-bottom: 15px;
            text-shadow: 0 0 12px var(--accent-color);
        }

        .profile-avatar {
            width: 150px;
            height: 150px;
            border-radius: 5px; 
            border: 3px solid var(--secondary-accent); 
            margin: 0 auto 25px;
            object-fit: cover;
        }
        
        .info-box {
            margin: 25px 0;
            padding: 20px;
            border-left: 5px solid var(--secondary-accent);
            background-color: rgba(255, 51, 102, 0.1); 
            text-align: left;
        }

        .info-box p {
            margin: 8px 0;
            font-size: 1.15em;
        }
        
        .info-box strong {
            color: var(--accent-color); 
        }

        /* --- НОВЫЕ СТИЛИ ДЛЯ ПЛЕЕРА --- */
        .music-widget-container {
            /* Этот контейнер заменит старый заголовок и стилизует плеер */
            margin-top: 30px;
            padding: 20px;
            border-radius: 5px;
            background: linear-gradient(135deg, var(--bg-dark), rgba(30, 10, 50, 0.8));
            border: 1px solid var(--secondary-accent);
        }

        .music-iframe {
            width: 100%; 
            height: 150px; /* Высота стандартного плеера ЯМ */
            border: none; 
            border-radius: 4px;
        }

        .link-to-playlist {
            display: block;
            margin-top: 10px;
            font-size: 0.9em;
            color: #ffffff;
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        .link-to-playlist:hover {
            opacity: 1;
            color: var(--accent-color);
        }
        /* --- КОНЕЦ НОВЫХ СТИЛЕЙ --- */


        .links a {
            color: #ffddff; 
            text-decoration: none;
            margin: 0 18px;
            font-size: 1.2em;
            transition: color 0.3s, text-shadow 0.3s;
        }
        
        .links a:hover {
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-color);
        }
    </style>
</head>
<body>

    <!-- ВИДЕОФОН -->
    <video autoplay loop muted playsinline id="background-video">
        <source src="bg_edit.mp4" type="video/mp4">
        Ваш браузер не поддерживает теги видео.
    </video>

    <div class="container">
        
        <img src="dima_avatar.jpg" alt="Profile Avatar" class="profile-avatar"> 
        
        <h1>Gamse_Over</h1>

        <!-- ИНФО-БОКС: Объединяем Диму, Возраст и ДР -->
        <div class="info-box">
            <p><strong>Имя:</strong> Дима</p>
            <p><strong>Возраст:</strong> <span id="age">...</span> лет</p>
            <p><strong>День Рождения:</strong> 31 Декабря</p>
        </div>

        <!-- НОВЫЙ КОНТЕЙНЕР ДЛЯ ПЛЕЕРА -->
        <div class="music-widget-container">
            <!-- !!! ВСТАВЬТЕ ССЫЛКУ ДЛЯ ВСТРАИВАНИЯ ЯНДЕКС.МУЗЫКИ ЗДЕСЬ !!! -->
            <iframe 
                src="https://music.yandex.ru/iframe/playlist/overgamse/3" 
                class="music-iframe"
                allowfullscreen
            ></iframe>
            <!-- Ссылка для перехода на сайт ЯМ (можно заменить на что-то другое) -->
            <a href="https://music.yandex.ru/playlists/lk.2b83a06b-66d4-431f-a504-7f2f9d7ef9b9?utm_source=desktop&amp;utm_medium=copy_link" target="_blank" class="link-to-playlist">
                Открыть плейлист в Яндекс Музыке
            </a>
        </div>
        
        <!-- Ссылки -->
        <div class="links" style="margin-top: 30px;">
            <a href="https://t.me/Gamse_Over_mosh" target="_blank">Telegram</a>
            <a href="https://steamcommunity.com/profiles/76561199182615593/" target="_blank">Steam</a>
        </div>
    </div>

    <!-- === JavaScript для расчета возраста === -->
    <script>
        // Расчет возраста (2006 год)
        const birthDate = new Date("2006-12-31T00:00:00"); 
        const today = new Date();
        let age = today.getFullYear() - birthDate.getFullYear();
        
        const hasHadBirthday = today.getMonth() > birthDate.getMonth() || 
                               (today.getMonth() === birthDate.getMonth() && today.getDate() >= birthDate.getDate());
        
        if (!hasHadBirthday) {
            age--;
        }

        document.getElementById('age').textContent = age;
    </script>

</body>
</html>
